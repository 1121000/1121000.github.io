<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>英轩集团三十周年庆典大会座区查询</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    正文 {
      最小高度: 100vh;
      背景图片: url('1.png');
      背景尺寸: 覆盖;
      背景位置: 居中;
      背景重复: 不重复;
      字体系列: '微软雅黑', 无衬线;
      显示: flex;
      对齐方式: 居中;
      align-items: 居中;
      padding: 10px;
    }

    .container {
      显示: flex;
      宽度: 100%;
      最大宽度: 1200像素;
      高度: 85vh;
      背景: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(8px);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
    }

    .left-side {
      width: 45%;
      padding: 25px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .right-side {
      width: 55%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }

    .right-side img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 10px;
    }

    h1 {
      font-size: 19px;
      font-weight: bold;
      color: #222;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #007bff;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #0056b3;
    }

    .result-card {
      background-color: #eef7ff;
      border-left: 4px solid #007bff;
      padding: 16px;
      border-radius: 8px;
      font-size: 18px;
      color: #333;
      line-height: 1.5;
      display: none;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="left-side">
    <h1>🎉 英轩集团三十周年庆典大会座区查询 🎉</h1>
    <input type="text" id="nameInput" placeholder="请输入您的姓名" />
    <input type="text" id="numberInput" placeholder="请输入您的工号" />
    <button onclick="findSeat()">查询座区</button>
    <div class="result-card" id="resultCard"></div>
  </div>

  <div class="right-side">
    <img src="111.png" alt="会场座区图" />
  </div>
</div>

<script>
  // ✅ 请在此处填写实际参会人员名单
  const seatData = [
    { name: "张三", number: "12345", area: "A区", table: "3桌", seat: "5号" },
    { name: "李四", number: "67890", area: "B区", table: "2桌", seat: "1号" },
    { name: "王五", number: "13579", area: "C区", table: "1桌", seat: "8号" },
    // 👆 按照此格式继续添加真实数据
  ];

  function findSeat() {
    const name = document.getElementById("nameInput").value.trim();
    const number = document.getElementById("numberInput").value.trim();
    const resultDiv = document.getElementById("resultCard");

    if (!name || !number) {
      resultDiv.innerHTML = "⚠️ 请输入姓名和工号后再查询。";
      resultDiv.style.display = "block";
      return;
    }

    const match = seatData.find(item => item.name === name && item.number === number);

    if (match) {
      resultDiv.innerHTML = `
        <strong>${name}</strong><br>
        您的座区信息：<br>
        <span style="font-size:20px; color:#007bff; font-weight:bold;">
          ${match.area} ${match.table} ${match.seat}
        </span>
      `;
    } else {
      resultDiv.innerHTML = `
        ❌ 未找到“${name}”（工号 ${number}）的座区信息。<br>
        请联系现场工作人员。
      `;
    }

    resultDiv.style.display = "block";
  }
</script>

</body>
</html>
