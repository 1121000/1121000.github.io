<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>英轩集团三十周年庆典大会座区查询</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background-image: url('1.png');
      background-size: cover;
      background-position: center;
      font-family: 'Microsoft YaHei', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .container {
      width: 90%;
      max-width: 1200px;
      height: 80%;
      display: flex;
      overflow: hidden;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }

    .left-side, .right-side {
      width: 50%;
      padding: 30px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    h1 {
      color: #333;
      font-weight: bold;
      font-size: 20px;
      white-space: nowrap;
      margin-bottom: 20px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }

    .seat-map {
      width: 100%;
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      object-fit: contain;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="left-side">
    <h1>🎉 英轩集团三十周年庆典大会座区查询 🎉</h1>
    <input type="text" id="nameInput" placeholder="输入您的名字" />
    <input type="text" id="numberInput" placeholder="输入您的工号" />
    <button onclick="findSeat()">查询座区</button>
    <div class="result" id="seatResult"></div>
  </div>
  <div class="right-side">
    <img src="111.png" alt="座位图" class="seat-map" />
  </div>
</div>

<script>
  const seatData = [
    // 座位数据（请按实际名单填写）
  ];

  function findSeat() {
    const name = document.getElementById("nameInput").value.trim();
    const number = document.getElementById("numberInput").value.trim();

    if (!name || !number) {
      alert("请输入姓名及工号后再查询。");
      return;
    }

    const matches = seatData.filter(item => item.name === name && item.number === number);

    if (matches.length === 0) {
      alert(`未找到与“${name}”和工号“${number}”相关的座区信息，请联系现场工作人员。`);
    } else {
      const item = matches[0];
      document.getElementById("seatResult").textContent = `您的座区是：${item.area} ${item.table} ${item.seat}`;
    }
  }
</script>

</body>
</html>
